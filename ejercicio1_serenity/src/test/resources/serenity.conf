serenity {
    take.screenshots = AFTER_EACH_STEP
    console.colors = true
    project.name = "Sofka Challenge - Ejercicio 1 Serenity BDD"
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "disable-popup-blocking",
        "disable-default-apps",
        "disable-extensions-file-access-check",
        "disable-gpu",
        "disable-infobars"
      ]
    }
  }
}
